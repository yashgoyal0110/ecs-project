kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: products
nodes:
  - role: control-plane
    extraPortMappings:
      # Frontend NodePort -> host (EC2) port 8080
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "0.0.0.0"
        protocol: TCP
  - role: worker
  - role: worker
