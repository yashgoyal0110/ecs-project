apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: products
type: Opaque
stringData:
  # Mongo root credentials (consumed by the mongo container)
  MONGO_INITDB_ROOT_USERNAME: appuser
  MONGO_INITDB_ROOT_PASSWORD: change-me-please

  # Full connection string used by the backend.
  # Host "mongo" resolves to the mongo Service in this namespace.
  MONGO_URL: mongodb://appuser:change-me-please@mongo:27017/products?authSource=admin
